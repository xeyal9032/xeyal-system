# Custom App Permissions for Xeyal-System
# Tauri 2.0 format: commands.allow lists the Rust command names

[[permission]]
identifier = "allow-main-commands"
description = "Essential permissions for dev environment management"

[permission.commands]
allow = [
    "start_dev_environment",
    "stop_all_services",
    "open_project_folder",
    "pick_project_folder",
    "get_active_ports",
    "get_marketplace_plugins",
    "install_marketplace_plugin",
    "create_project",
    "read_project_file",
    "write_project_file",
    "get_project_structure",
    "invoke_ollama",
    "get_desktop_path",
    "install_dependencies",
    "get_available_skills",
    "launch_skill",
    "stop_skill",
    "run_forge_project",
    "check_onboarding_complete",
    "set_onboarding_complete",
    "check_ollama_installed",
    "install_ollama_agent",
    "open_ollama_download",
    "open_url",
    "check_ollama_model",
    "swarm_action",
    "execute_swarm_code",
    "read_forge_library",
    "heal_project"
]
