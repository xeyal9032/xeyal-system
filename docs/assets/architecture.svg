  <text x="145" y="295" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">17 commands</text>
  <rect x="240" y="250" width="150" height="60" rx="8" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6"/>
  <text x="315" y="275" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8b5cf6">Core Engine</text>
  <text x="315" y="295" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">runtime · AI</text>
  <rect x="410" y="250" width="150" height="60" rx="8" fill="rgba(236,72,153,0.1)" stroke="#ec4899"/>
  <text x="485" y="275" text-anchor="middle" font-family="system-ui" font-size="11" fill="#ec4899">Tauri Desktop</text>
  <text x="485" y="295" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">Forge · Swarm</text>
  <rect x="580" y="250" width="150" height="60" rx="8" fill="rgba(34,197,94,0.1)" stroke="#22c55e"/>
  <text x="655" y="275" text-anchor="middle" font-family="system-ui" font-size="11" fill="#22c55e">Web Dashboard</text>
  <text x="655" y="295" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">Socket.IO :3000</text>
  <rect x="750" y="250" width="180" height="60" rx="8" fill="rgba(251,191,36,0.1)" stroke="#eab308"/>
  <text x="840" y="275" text-anchor="middle" font-family="system-ui" font-size="11" fill="#eab308">Autopilot + Healer</text>
  <text x="840" y="295" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">Ollama · Auto-fix</text>
  <!-- launch-all -->
  <rect x="350" y="340" width="300" height="30" rx="15" fill="rgba(6,182,212,0.15)" stroke="#06b6d4"/>
  <text x="500" y="360" text-anchor="middle" font-family="monospace" font-size="11" fill="#06b6d4">launch-all.js ’ Cloud + Dashboard + my-system</text>
