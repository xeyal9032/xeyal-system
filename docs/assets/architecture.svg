<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06b6d4"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="12" fill="#0f172a"/>
  <text x="500" y="35" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="#f1f5f9">Xeyal System Architecture</text>
  <!-- SDK -->
  <rect x="40" y="70" width="140" height="70" rx="10" fill="rgba(6,182,212,0.15)" stroke="#06b6d4"/>
  <text x="110" y="100" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#06b6d4">SDK</text>
  <text x="110" y="120" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">Node.js Client</text>
  <!-- Cloud -->
  <rect x="240" y="70" width="160" height="70" rx="10" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6"/>
  <text x="320" y="100" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#8b5cf6">xeyal-cloud</text>
  <text x="320" y="120" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">Express API :4000</text>
  <!-- DB -->
  <rect x="460" y="70" width="140" height="70" rx="10" fill="rgba(236,72,153,0.15)" stroke="#ec4899"/>
  <text x="530" y="100" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#ec4899">PostgreSQL</text>
  <text x="530" y="120" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">Errors · Analyses</text>
  <!-- Dashboard -->
  <rect x="660" y="70" width="160" height="70" rx="10" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
  <text x="740" y="100" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#22c55e">Dashboard</text>
  <text x="740" y="120" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">React + Vite :5173</text>
  <!-- Ollama -->
  <rect x="860" y="70" width="100" height="70" rx="10" fill="rgba(251,191,36,0.15)" stroke="#eab308"/>
  <text x="910" y="100" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#eab308">Ollama</text>
  <text x="910" y="120" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">llama3</text>
