  <line x1="400" y1="105" x2="455" y2="105" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="105" x2="655" y2="105" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="105" x2="855" y2="105" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- my-system block -->
  <rect x="40" y="200" width="920" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="500" y="230" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#f1f5f9">my-system · Developer OS (v1.5.1)</text>
  <rect x="70" y="250" width="150" height="60" rx="8" fill="rgba(6,182,212,0.1)" stroke="#06b6d4"/>
