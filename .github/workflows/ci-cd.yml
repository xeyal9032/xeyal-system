name: Xeyal Cloud CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: xeyal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'xeyal-cloud/package-lock.json'

    - name: Install Backend Dependencies
      run: |
        cd xeyal-cloud
        npm install

    - name: Run Backend Tests
      run: |
        cd xeyal-cloud
        npm test
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/xeyal_test

    - name: Build Dashboard
      run: |
        cd xeyal-dashboard
        npm install
        npm run build

    - name: Deploy to Production (Example)
      if: github.ref == 'refs/heads/main'
      run: echo "Deploying to production server..."
      # Add your deployment logic here (e.g., Railway, Render, or SSH)
